name: CI - LMS SaaS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # --- Backend Build & Test ---
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/LMS.slnx

      - name: Build solution
        run: dotnet build backend/LMS.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/LMS.slnx --configuration Release --no-build --verbosity normal

  # --- Frontend Build & Test ---
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend

  # --- Docker Build ---
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f backend/src/LMS.Api/Dockerfile -t lms-api:latest ./backend

      - name: Build Web Docker image
        run: docker build -f frontend/Dockerfile -t lms-web:latest ./frontend
